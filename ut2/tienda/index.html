<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TiendaTech · Inicio</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>TiendaTech</h1>
    <nav aria-label="Principal">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Ofertas</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Novedades</h2>
      <div class="rejilla">
        <article class="tarjeta">
          <img src="router.svg" alt="Router Wi-Fi 6 de color azul" width="120" height="80">
          <h3>Router AX3000</h3>
          <p class="precio">89,90 €</p>
          <a class="boton" href="#">Ver producto</a>
        </article>
        <article class="tarjeta">
          <img src="switch.svg" alt="Switch de ocho puertos" width="120" height="80">
          <h3>Switch 8 puertos</h3>
          <p class="precio">34,50 €</p>
          <a class="boton" href="#">Ver producto</a>
        </article>
        <article class="tarjeta">
          <img src="cable.svg" alt="Cable de red trenzado" width="120" height="80">
          <h3>Cable Cat6 5 m</h3>
          <p class="precio">6,95 €</p>
          <a class="boton" href="#">Ver producto</a>
        </article>
      </div>
    </section>
    <aside class="aviso">
      <p><strong>Envío gratis</strong> en pedidos de más de 50 €.</p>
    </aside>
  </main>
  <footer>
    <p>© 2026 TiendaTech · Totana (Murcia)</p>
  </footer>
</body>
</html>
